[project]
name = "ckanext-public-edit"
version = "0.1.0"
description = "CKAN extension: any logged-in user can edit public datasets. Delete restricted to org admins."
readme = "README.md"
license = {text = "AGPL-3.0"}
requires-python = ">=3.8"
dependencies = []

[project.entry-points."ckan.plugins"]
public_edit = "ckanext.public_edit.plugin:PublicEditPlugin"

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ckanext*"]
