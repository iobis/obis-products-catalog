[metadata]
name = ckanext-public-edit
version = 0.1.0
description = Any logged-in user can edit public datasets. Delete restricted to org admins.
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0

[options]
packages = find_namespace:
include_package_data = True

[options.packages.find]
include = ckanext*

[options.entry_points]
ckan.plugins =
    public_edit = ckanext.public_edit.plugin:PublicEditPlugin
