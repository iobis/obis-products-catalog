<section class="module module-narrow module-shallow">
  <h2 class="module-heading">What are Nodes?</h2>
  <div class="module-content">
    <p>OBIS Nodes are the regional and thematic members of the OBIS network. Each node manages, curates, and publishes marine biodiversity data products on behalf of their region or community.</p>
    <p>Products in the catalog are associated with the node that stewards the product.</p>
  </div>
</section>
