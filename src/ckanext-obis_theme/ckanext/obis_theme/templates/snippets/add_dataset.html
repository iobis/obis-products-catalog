{# Override: links to new-choice page instead of dataset.new, passes org #}
{% set link_label = _("Add Product") %}
{% if group %}
    <a href="/dataset/new-choice?owner_org={{ group }}" class="btn btn-primary">
      <i class="fa fa-plus-square"></i> {{ link_label }}
    </a>
{% else %}
    <a href="/dataset/new-choice" class="btn btn-primary">
      <i class="fa fa-plus-square"></i> {{ link_label }}
    </a>
{% endif %}
